[package]
name = "openzeppelin-pallet-abstractions"
authors = [ "OpenZeppelin" ]
description = "Abstractions that provide sensible defaults for constructing Polkadot parachain runtimes"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/OpenZeppelin/openzeppelin-pallet-abstractions"
readme = "README.md"
version = "0.1.0"

[dependencies]
frame-support = { git = "https://github.com/moondance-labs/polkadot-sdk", default-features = false, rev = "33a925ed7a1a70f3db904cb88bc301c7b6c0ce30" }
frame-system = { git = "https://github.com/moondance-labs/polkadot-sdk", default-features = false, rev = "33a925ed7a1a70f3db904cb88bc301c7b6c0ce30" }
scale-info = { version = "2.11.1", default-features = false }
sp-std = { git = "https://github.com/moondance-labs/polkadot-sdk", default-features = false, rev = "33a925ed7a1a70f3db904cb88bc301c7b6c0ce30" }
sp-version = { git = "https://github.com/moondance-labs/polkadot-sdk", default-features = false, rev = "33a925ed7a1a70f3db904cb88bc301c7b6c0ce30" }

# Cumulus
cumulus-primitives-core = { git = "https://github.com/moondance-labs/polkadot-sdk", default-features = false, rev = "33a925ed7a1a70f3db904cb88bc301c7b6c0ce30" }

[features]
default = [ "std" ]
std = [
	"cumulus-primitives-core/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"sp-std/std",
	"sp-version/std",
]
